<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>YouTube Downloader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .wrapper { width: min(900px, 90vw); padding: 3rem 4vw; }
        h1 { margin-bottom: 1.5rem; font-size: clamp(2rem, 4vw, 3rem); }
        form { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.5rem; }
        input[type="text"] {
            flex: 1 1 400px; padding: 0.85rem 1rem; border-radius: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(15, 23, 42, 0.6); color: inherit; font-size: 1rem;
        }
        button {
            padding: 0.85rem 1.5rem; border-radius: 0.75rem; border: none; font-size: 1rem; font-weight: 600;
            cursor: pointer; color: #0f172a; background: linear-gradient(135deg,#38bdf8,#22d3ee);
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 10px 25px rgba(34, 211, 238, 0.2); }
        /* "Check video" busy state while the server fetches the video (a few seconds). */
        @keyframes btn-spin { to { transform: rotate(360deg); } }
        #check-btn.loading { opacity: 0.85; cursor: progress; transform: none; box-shadow: none; }
        #check-btn.loading::before {
            content: ""; display: inline-block; width: 0.9em; height: 0.9em;
            margin-right: 0.5em; vertical-align: -0.12em; box-sizing: border-box;
            border: 2px solid rgba(15, 23, 42, 0.35); border-top-color: #0f172a;
            border-radius: 50%; animation: btn-spin 0.7s linear infinite;
        }
        .alert { padding: 1rem 1.25rem; border-radius: 0.75rem; margin-bottom: 1.5rem; font-weight: 500; }
        .alert.error { background: rgba(239, 68, 68, 0.15); color: #fecaca; border: 1px solid rgba(239, 68, 68, 0.4); }
        .alert.success { background: rgba(34, 197, 94, 0.18); color: #bbf7d0; border: 1px solid rgba(34, 197, 94, 0.4); }
        .deno-banner { margin-bottom: 1.25rem; padding: 0.9rem 1.1rem; border-radius: 0.75rem; font-size: 0.9rem; background: rgba(234, 179, 8, 0.12); border: 1px solid rgba(234, 179, 8, 0.4); color: #fde68a; }
        .deno-banner.done { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); color: #bbf7d0; }
        .deno-banner.error { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #fecaca; }
        .deno-bar { margin-top: 0.6rem; height: 8px; border-radius: 999px; background: rgba(148, 163, 184, 0.25); overflow: hidden; }
        .deno-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #38bdf8, #22d3ee); transition: width 0.2s ease; }

        /* Player modal */
        .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
        .modal[hidden] { display: none; }
        .modal-backdrop { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(2px); }
        .modal-box {
            position: relative; z-index: 1; width: min(760px, 92vw); max-height: 90vh; overflow: auto;
            background: #0f172a; border: 1px solid rgba(148, 163, 184, 0.3); border-radius: 1rem; padding: 1.25rem;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5); display: grid; gap: 0.9rem;
        }
        .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .modal-title { font-size: 1.1rem; font-weight: 600; }
        .modal-close {
            padding: 0.35rem 0.7rem; font-size: 1rem; line-height: 1; color: #f8fafc;
            background: rgba(148, 163, 184, 0.18); border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .modal-close:hover { background: rgba(239, 68, 68, 0.3); box-shadow: none; }
        .modal-video { width: 100%; max-height: 60vh; background: #000; border-radius: 0.6rem; }
        .modal-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; }
        .modal-controls button { padding: 0.5rem 1rem; font-size: 0.9rem; }
        .modal-vol { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; color: rgba(226, 232, 240, 0.85); }
        .modal-vol input[type="range"] { accent-color: #38bdf8; cursor: pointer; }
        .modal-path {
            font-size: 0.8rem; color: rgba(226, 232, 240, 0.7); word-break: break-all;
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 0.5rem; padding: 0.5rem 0.7rem;
        }
        .placeholder {
            padding: 2rem; border-radius: 1rem; background: rgba(148, 163, 184, 0.12);
            border: 1px dashed rgba(148, 163, 184, 0.4); color: rgba(226, 232, 240, 0.9); line-height: 1.6;
        }
        .card {
            display: flex; flex-direction: column; gap: 1.5rem;
            background: rgba(148, 163, 184, 0.08); border-radius: 1.25rem; padding: 1.75rem; border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .card-head { display: grid; grid-template-columns: minmax(0, 280px) 1fr; gap: 1.5rem; align-items: start; }
        @media (max-width: 560px) { .card-head { grid-template-columns: 1fr; } }
        .card img { width: 100%; border-radius: 1rem; border: 1px solid rgba(148, 163, 184, 0.3); object-fit: cover; max-height: 220px; }
        .meta { display: grid; gap: 0.75rem; align-content: start; }
        .meta h2 { margin: 0; font-size: 1.5rem; line-height: 1.3; }
        .meta .stats { display: flex; flex-wrap: wrap; gap: 0.75rem; font-size: 0.95rem; color: rgba(226, 232, 240, 0.9); }
        .meta .stats span { background: rgba(148, 163, 184, 0.16); padding: 0.35rem 0.75rem; border-radius: 999px; }
        .card .links { display: grid; gap: 0.75rem; }
        .format-list { margin-top: 1.25rem; display: grid; gap: 0.75rem; }
        .format-list h3 { margin: 0; font-size: 1.05rem; font-weight: 600; color: rgba(226, 232, 240, 0.95); }
        .format-filter { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 0.75rem; align-items: center; padding: 0.25rem 0; }
        .format-filter label {
            display: inline-flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none;
            padding: 0.4rem 0.7rem; border-radius: 999px; font-size: 0.9rem; font-weight: 500;
            color: rgba(226, 232, 240, 0.8); background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(148, 163, 184, 0.28);
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
        }
        .format-filter label:hover { color: #f8fafc; border-color: rgba(56, 189, 248, 0.55); transform: translateY(-1px); }
        .format-filter input[type="radio"] { position: absolute; opacity: 0; width: 0; height: 0; margin: 0; pointer-events: none; }
        .format-filter label:has(input:checked) {
            background: linear-gradient(135deg, #38bdf8, #22d3ee); color: #0f172a; font-weight: 600;
            border-color: transparent; box-shadow: 0 6px 16px rgba(34, 211, 238, 0.22);
        }
        .format-filter label:has(input:focus-visible) { outline: 2px solid rgba(56, 189, 248, 0.7); outline-offset: 2px; }
        .format-filter .fi { width: 30px; height: 30px; flex: 0 0 auto; }
        .combo-btn {
            position: relative; isolation: isolate; overflow: hidden;
            margin-left: auto; padding: 0.45rem 0.9rem; font-size: 0.85rem; font-weight: 600;
            background: #0f172a; color: #f8fafc; border: 1px solid rgba(248, 250, 252, 0.6);
        }
        .combo-btn:hover { transform: none; box-shadow: none; }
        /* The fill sweeps left→right; the label inverts over it via blend mode. */
        .combo-btn .combo-fill {
            position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
            background: #f8fafc; z-index: 0; transition: width 0.25s ease;
        }
        .combo-btn .combo-label {
            position: relative; z-index: 1; mix-blend-mode: difference; color: #fff;
            display: inline-block; white-space: nowrap;
        }
        .combo-btn.unavailable { opacity: 0.45; cursor: not-allowed; }
        /* Group the action buttons together at the right: only the first gets the auto push. */
        #combo-best { margin-left: 0; }
        .format-card[data-hidden="true"] { display: none; }
        .format-grid { display: grid; gap: 0.4rem; }
        .format-card {
            display: flex; align-items: center; flex-wrap: wrap; gap: 0.55rem; font-size: 0.92rem;
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 0.6rem; padding: 0.55rem 0.85rem; text-decoration: none; color: inherit; cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .format-card:hover { transform: translateY(-1px); border-color: rgba(56, 189, 248, 0.6); box-shadow: 0 8px 18px rgba(56, 189, 248, 0.12); }
        .format-card.loading { opacity: 0.65; pointer-events: none; }
        .format-card.success { border-color: rgba(34, 197, 94, 0.6); }
        .format-card.error { border-color: rgba(239, 68, 68, 0.6); }
        .format-empty { margin: 0.5rem 0 0; padding: 0.75rem 0.9rem; border-radius: 0.6rem; font-size: 0.9rem; color: rgba(226, 232, 240, 0.7); background: rgba(148, 163, 184, 0.1); border: 1px dashed rgba(148, 163, 184, 0.35); }
        .format-empty[hidden] { display: none; }
        .format-itag { font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; min-width: 2.6rem; }
        .format-sep { color: rgba(148, 163, 184, 0.4); }
        .format-quality { font-weight: 600; }
        .format-codecs { color: rgba(226, 232, 240, 0.8); }
        .format-meta { color: rgba(226, 232, 240, 0.7); }
        .format-status { margin-left: auto; font-size: 0.8rem; color: rgba(226, 232, 240, 0.7); }
        .format-card.success .format-status { color: #bbf7d0; }
        .format-card.error .format-status { color: #fecaca; }
        a { color: #38bdf8; }
        .muted { color: rgba(226, 232, 240, 0.65); }

        /* Subtitles */
        .subs { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid rgba(148, 163, 184, 0.2); display: grid; gap: 0.75rem; }
        .subs h3 { margin: 0; font-size: 1.05rem; font-weight: 600; color: rgba(226, 232, 240, 0.95); }
        .subs-controls { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
        .subs select {
            padding: 0.5rem 0.7rem; border-radius: 0.6rem; font-size: 0.9rem;
            background: rgba(15, 23, 42, 0.6); color: inherit; border: 1px solid rgba(148, 163, 184, 0.35);
            max-width: 100%;
        }
        #subs-lang { flex: 1 1 240px; min-width: 0; }
        #subs-format { flex: 0 0 auto; }
        #subs-download { padding: 0.5rem 1rem; font-size: 0.9rem; }
        #subs-download:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .subs-status { font-size: 0.85rem; min-height: 1.1rem; color: rgba(226, 232, 240, 0.8); }
        .subs-status.error { color: #fecaca; }
        .subs-status.success { color: #bbf7d0; }
        .subs-status.muted { color: rgba(226, 232, 240, 0.6); }

        /* File explorer */
        .explorer {
            margin-top: 2rem; background: rgba(148, 163, 184, 0.08); border-radius: 1.25rem;
            padding: 1.5rem 1.75rem; border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .explorer-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.75rem; }
        .explorer-head h3 { margin: 0; font-size: 1.1rem; }
        #open-folder { cursor: pointer; user-select: none; transition: color 0.12s ease; }
        #open-folder:hover { color: #7dd3fc; text-decoration: underline; }
        #open-folder:focus-visible { outline: 2px solid rgba(56, 189, 248, 0.7); outline-offset: 3px; border-radius: 0.4rem; }
        .explorer-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-secondary {
            padding: 0.55rem 1rem; font-size: 0.9rem; color: #f8fafc;
            background: rgba(148, 163, 184, 0.18); border: 1px solid rgba(148, 163, 184, 0.3);
        }
        .btn-secondary:hover { background: rgba(148, 163, 184, 0.28); box-shadow: none; }
        #merge-btn, #mp3-btn { padding: 0.55rem 1.1rem; font-size: 0.9rem; }
        #merge-btn:disabled, #mp3-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .explorer-status { margin: 0.85rem 0 0; font-size: 0.85rem; min-height: 1.1rem; color: rgba(226, 232, 240, 0.8); }
        .explorer-status.error { color: #fecaca; }
        .explorer-status.success { color: #bbf7d0; }
        .file-list { margin-top: 0.85rem; display: grid; gap: 0.5rem; }
        .file-row {
            display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.85rem;
            background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(148, 163, 184, 0.2); border-radius: 0.7rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        /* Two most recently downloaded files get a bright amber highlight. */
        .file-row.recent {
            border-color: #fbbf24;
            box-shadow: 0 0 0 1px #fbbf24, 0 0 16px rgba(251, 191, 36, 0.5);
        }
        .file-row.recent .file-name { color: #fde68a; font-weight: 600; }
        .file-badge-new {
            flex: 0 0 auto; font-size: 0.62rem; text-transform: uppercase; font-weight: 700;
            letter-spacing: 0.05em; padding: 0.15rem 0.45rem; border-radius: 999px;
            background: #fbbf24; color: #0f172a;
        }
        .file-row input[type="checkbox"] {
            appearance: none; -webkit-appearance: none; margin: 0; flex: 0 0 auto; cursor: pointer;
            width: 1.25rem; height: 1.25rem; border-radius: 0.4rem;
            border: 1px solid rgba(148, 163, 184, 0.5); background: rgba(15, 23, 42, 0.6);
            display: inline-grid; place-content: center;
            transition: background 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
        }
        .file-row input[type="checkbox"]::before {
            content: ""; width: 0.7rem; height: 0.7rem; transform: scale(0); transform-origin: center;
            transition: transform 0.12s ease; background: #0f172a;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .file-row input[type="checkbox"]:hover { border-color: rgba(56, 189, 248, 0.7); }
        .file-row input[type="checkbox"]:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35); }
        .file-row input[type="checkbox"]:checked { background: linear-gradient(135deg, #38bdf8, #22d3ee); border-color: transparent; }
        .file-row input[type="checkbox"]:checked::before { transform: scale(1); }
        .file-row label { flex: 1 1 auto; cursor: pointer; display: flex; align-items: center; gap: 0.6rem; min-width: 0; }
        .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-type {
            flex: 0 0 auto; font-size: 0.7rem; text-transform: uppercase; font-weight: 600; letter-spacing: 0.03em;
            padding: 0.15rem 0.5rem; border-radius: 999px;
        }
        .file-type.video { background: rgba(56, 189, 248, 0.18); color: #7dd3fc; }
        .file-type.audio { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
        .file-type.other { background: rgba(148, 163, 184, 0.2); color: rgba(226, 232, 240, 0.85); }
        .file-size { flex: 0 0 auto; font-size: 0.8rem; color: rgba(226, 232, 240, 0.6); }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>YouTube Downloader</h1>
        <form method="get" action="/">
            <input type="text" name="url" placeholder="https://www.youtube.com/watch?v=..." value="{{ESCAPED_INPUT}}" autocomplete="off" />
            <button type="submit" id="check-btn">Check video</button>
        </form>
        <div id="deno-banner" class="deno-banner" hidden>
            <div id="deno-msg"></div>
            <div class="deno-bar" id="deno-bar"><div class="deno-fill" id="deno-fill"></div></div>
        </div>
        {{RESULT_SECTION}}
    </div>
    <div id="player-modal" class="modal" hidden aria-modal="true" role="dialog">
        <div class="modal-backdrop" data-close></div>
        <div class="modal-box">
            <div class="modal-head">
                <span class="modal-title">Результат</span>
                <button type="button" class="modal-close" data-close aria-label="Закрыть">✕ Закрыть</button>
            </div>
            <video id="player-video" class="modal-video" playsinline preload="metadata"></video>
            <div class="modal-controls">
                <button type="button" id="player-play">▶ Play</button>
                <button type="button" id="player-stop">⏹ Stop</button>
                <label class="modal-vol">🔊 <input type="range" id="player-vol" min="0" max="1" step="0.05" value="1"></label>
            </div>
            <div class="modal-path" id="player-path"></div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const delay = (ms) => new Promise((r) => setTimeout(r, ms));

            // "Check video" is a full-page form submit that can take several seconds
            // while the server fetches the video. Show a busy state and block re-clicks
            // until the next page (result or error) loads.
            const checkBtn = document.getElementById("check-btn");
            const checkForm = checkBtn ? checkBtn.closest("form") : null;
            if (checkForm && checkBtn) {
                checkForm.addEventListener("submit", () => {
                    // The submit is already in flight; disabling now doesn't cancel it.
                    checkBtn.classList.add("loading");
                    checkBtn.textContent = "Checking…";
                    // Re-enable shortly after in case navigation is cancelled (e.g. back button).
                    setTimeout(() => { checkBtn.disabled = true; }, 0);
                });
            }

            // ---- Auto-install deno (JS runtime yt-dlp needs for some videos) ----
            (function initDeno() {
                const banner = document.getElementById("deno-banner");
                const msg = document.getElementById("deno-msg");
                const bar = document.getElementById("deno-bar");
                const fill = document.getElementById("deno-fill");
                if (!banner) return;
                const show = (text, cls) => { banner.hidden = false; msg.textContent = text; banner.className = "deno-banner" + (cls ? " " + cls : ""); };
                const setPct = (p) => { fill.style.width = (p || 0) + "%"; };
                const poll = async () => {
                    try {
                        const r = await fetch("/deno-status", { headers: { "X-Requested-With": "fetch" } });
                        const d = await r.json();
                        if (d.installed) { setPct(100); bar.style.display = "none"; show("JS-движок (deno) установлен ✓", "done"); return; }
                        if (d.error) { bar.style.display = "none"; show("Не удалось установить deno: " + d.error, "error"); return; }
                        if (d.downloading) { setPct(d.percent); show("Загрузка JS-движка (deno)… " + (d.percent || 0) + "%"); setTimeout(poll, 500); return; }
                        // Missing and idle → kick off the install.
                        show("Устанавливаю JS-движок (deno) для полной поддержки видео…");
                        await fetch("/install-deno", { headers: { "X-Requested-With": "fetch" } });
                        setTimeout(poll, 500);
                    } catch (e) { bar.style.display = "none"; show("Ошибка проверки deno: " + (e.message || e), "error"); }
                };
                (async () => {
                    try {
                        const r = await fetch("/deno-status", { headers: { "X-Requested-With": "fetch" } });
                        const d = await r.json();
                        if (!d.installed) poll();
                    } catch (e) { /* ignore — banner stays hidden */ }
                })();
            })();

            // ---- Player modal (minimal: play/stop, volume, close) ----
            let downloadedDir = null;
            fetch("/downloaded-dir", { headers: { "X-Requested-With": "fetch" } })
                .then((r) => r.json()).then((d) => { downloadedDir = d.path || null; }).catch(() => {});
            const playerModal = document.getElementById("player-modal");
            const playerVideo = document.getElementById("player-video");
            const playerPlay = document.getElementById("player-play");
            const playerStop = document.getElementById("player-stop");
            const playerVol = document.getElementById("player-vol");
            const playerPath = document.getElementById("player-path");
            const closePlayer = () => {
                if (!playerModal) return;
                if (playerVideo) { playerVideo.pause(); playerVideo.removeAttribute("src"); playerVideo.load(); }
                playerModal.hidden = true;
            };
            const openPlayer = (name) => {
                if (!playerModal || !name) return;
                playerVideo.src = "/file?name=" + encodeURIComponent(name);
                playerVideo.volume = playerVol ? parseFloat(playerVol.value) : 1;
                playerVideo.load();
                playerPath.textContent = downloadedDir ? (downloadedDir + "\\" + name) : name;
                if (playerPlay) playerPlay.textContent = "▶ Play";
                playerModal.hidden = false;
            };
            if (playerModal) {
                playerModal.querySelectorAll("[data-close]").forEach((el) => el.addEventListener("click", closePlayer));
                document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !playerModal.hidden) closePlayer(); });
                if (playerPlay) playerPlay.addEventListener("click", () => { if (playerVideo.paused) playerVideo.play(); else playerVideo.pause(); });
                if (playerStop) playerStop.addEventListener("click", () => { playerVideo.pause(); playerVideo.currentTime = 0; });
                if (playerVol) playerVol.addEventListener("input", () => { playerVideo.volume = parseFloat(playerVol.value); });
                if (playerVideo) {
                    playerVideo.addEventListener("play", () => { if (playerPlay) playerPlay.textContent = "⏸ Pause"; });
                    playerVideo.addEventListener("pause", () => { if (playerPlay) playerPlay.textContent = "▶ Play"; });
                }
            }

            // ---- File explorer + merge ----
            const fileList = document.getElementById("file-list");
            const mergeBtn = document.getElementById("merge-btn");
            const mp3Btn = document.getElementById("mp3-btn");
            const refreshBtn = document.getElementById("refresh-files");
            const explorerStatus = document.getElementById("explorer-status");

            const selectedNames = () =>
                Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked')).map((c) => c.value);

            const formatSize = (bytes) => {
                if (!bytes) return "0 B";
                const units = ["B", "KB", "MB", "GB"];
                let i = 0, n = bytes;
                while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
                return n.toFixed(i === 0 ? 0 : 1) + " " + units[i];
            };

            const setStatus = (msg, kind) => {
                if (!explorerStatus) return;
                explorerStatus.textContent = msg || "";
                explorerStatus.className = "explorer-status" + (kind ? " " + kind : "");
            };

            const updateButtons = () => {
                if (!fileList) return;
                const checkedBoxes = Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked'));
                if (mergeBtn) mergeBtn.disabled = checkedBoxes.length < 2;
                if (mp3Btn) {
                    // Enable only when every checked file has audio and isn't already MP3.
                    const convertible = checkedBoxes.length >= 1 && checkedBoxes.every((c) =>
                        c.dataset.hasAudio === "1" && !c.value.toLowerCase().endsWith(".mp3"));
                    mp3Btn.disabled = !convertible;
                }
            };

            const loadFiles = async () => {
                if (!fileList) return;
                try {
                    const res = await fetch("/files", { headers: { "X-Requested-With": "fetch" } });
                    const data = await res.json();
                    const files = data.files || [];
                    // Newest downloads first; ties fall back to name so order stays stable.
                    files.sort((a, b) =>
                        (b.modified || 0) - (a.modified || 0) || a.name.localeCompare(b.name));
                    fileList.innerHTML = "";
                    if (files.length === 0) {
                        fileList.innerHTML = '<p class="muted">No files yet. Download a video/audio stream above.</p>';
                    } else {
                        // The two files with the newest mtime are the latest downloads.
                        const recentNames = new Set(
                            [...files]
                                .filter((f) => f.modified)
                                .sort((a, b) => b.modified - a.modified)
                                .slice(0, 2)
                                .map((f) => f.name)
                        );
                        for (const f of files) {
                            const row = document.createElement("div");
                            row.className = "file-row";
                            const isRecent = recentNames.has(f.name);
                            if (isRecent) row.classList.add("recent");
                            const id = "f_" + Math.random().toString(36).slice(2);
                            const cb = document.createElement("input");
                            cb.type = "checkbox"; cb.id = id; cb.value = f.name;
                            cb.dataset.hasAudio = f.hasAudio ? "1" : "0";
                            cb.addEventListener("change", updateButtons);
                            const label = document.createElement("label");
                            label.htmlFor = id;
                            const typeSpan = document.createElement("span");
                            typeSpan.className = "file-type " + (f.type || "other");
                            typeSpan.textContent = f.type || "other";
                            const nameSpan = document.createElement("span");
                            nameSpan.className = "file-name";
                            nameSpan.textContent = f.name;
                            label.appendChild(typeSpan);
                            label.appendChild(nameSpan);
                            if (isRecent) {
                                const newBadge = document.createElement("span");
                                newBadge.className = "file-badge-new";
                                newBadge.textContent = "new";
                                label.appendChild(newBadge);
                            }
                            const sizeSpan = document.createElement("span");
                            sizeSpan.className = "file-size";
                            sizeSpan.textContent = formatSize(f.size);
                            row.appendChild(cb);
                            row.appendChild(label);
                            row.appendChild(sizeSpan);
                            fileList.appendChild(row);
                        }
                    }
                    updateButtons();
                } catch (err) {
                    setStatus("Could not load files: " + (err.message || err), "error");
                }
            };

            if (refreshBtn) refreshBtn.addEventListener("click", loadFiles);

            const openFolder = document.getElementById("open-folder");
            const openFolderInExplorer = async () => {
                try {
                    const res = await fetch("/open-folder", { headers: { "X-Requested-With": "fetch" } });
                    const data = await res.json();
                    if (data.status !== "ok") setStatus(data.message || "Could not open folder.", "error");
                } catch (err) {
                    setStatus("Could not open folder: " + (err.message || err), "error");
                }
            };
            if (openFolder) {
                openFolder.addEventListener("click", openFolderInExplorer);
                openFolder.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFolderInExplorer(); }
                });
            }

            if (mergeBtn) {
                mergeBtn.addEventListener("click", async () => {
                    const selected = Array.from(fileList.querySelectorAll('input[type="checkbox"]:checked')).map((c) => c.value);
                    if (selected.length < 2) return;
                    mergeBtn.disabled = true;
                    setStatus("Re-encoding to H.264/AAC MP4 for Telegram/Android/iPhone — 0%");
                    try {
                        const m = await runMerge(selected, (p) =>
                            setStatus("Re-encoding to H.264/AAC MP4 for Telegram/Android/iPhone — " + p + "%"));
                        if (m.success) {
                            setStatus(m.message || "Merged.", "success");
                            await loadFiles();
                        } else {
                            setStatus(m.error || "Merge failed.", "error");
                            updateButtons();
                        }
                    } catch (err) {
                        setStatus("Merge failed: " + (err.message || err), "error");
                        updateButtons();
                    }
                });
            }

            if (mp3Btn) {
                mp3Btn.addEventListener("click", async () => {
                    const selected = selectedNames();
                    if (selected.length < 1) return;
                    const params = new URLSearchParams();
                    selected.forEach((name) => params.append("files", name));
                    mp3Btn.disabled = true;
                    setStatus("Converting to MP3 (192 kbps)…");
                    try {
                        const res = await fetch("/to-mp3?" + params.toString(), { headers: { "X-Requested-With": "fetch" } });
                        const data = await res.json();
                        if (data.status === "ok") {
                            setStatus(data.message || "Converted.", "success");
                            await loadFiles();
                        } else {
                            setStatus(data.message || "Conversion failed.", "error");
                            updateButtons();
                        }
                    } catch (err) {
                        setStatus("Conversion failed: " + (err.message || err), "error");
                        updateButtons();
                    }
                });
            }

            loadFiles();

            // ---- Subtitles (shown only under the SUB filter; list loads lazily) ----
            const subsPanel = document.getElementById("subs");
            let subsLoaded = false;
            let loadSubs = () => {};
            if (subsPanel) {
                const langSel = document.getElementById("subs-lang");
                const fmtSel = document.getElementById("subs-format");
                const subsDl = document.getElementById("subs-download");
                const subsStat = document.getElementById("subs-status");
                const video = subsPanel.dataset.video;
                const setSubStatus = (m, k) => { subsStat.textContent = m || ""; subsStat.className = "subs-status" + (k ? " " + k : ""); };

                loadSubs = async () => {
                    if (subsLoaded) return;
                    subsLoaded = true;
                    setSubStatus("Загрузка списка субтитров…");
                    try {
                        const res = await fetch("/subtitles?video=" + encodeURIComponent(video), { headers: { "X-Requested-With": "fetch" } });
                        const data = await res.json();
                        if (data.status !== "ok") { langSel.innerHTML = '<option value="">—</option>'; setSubStatus(data.message || "Не удалось получить субтитры", "error"); subsLoaded = false; return; }
                        const tracks = data.tracks || [];
                        if (!tracks.length) { langSel.innerHTML = '<option value="">Нет субтитров</option>'; setSubStatus("У этого видео нет субтитров.", "muted"); return; }
                        langSel.innerHTML = "";
                        for (const t of tracks) {
                            const opt = document.createElement("option");
                            opt.value = t.kind + ":" + t.lang;
                            const kindLabel = t.kind === "manual" ? "ручные" : "авто";
                            const name = (t.name && t.name !== t.lang) ? " — " + t.name : "";
                            opt.textContent = t.lang + name + " (" + kindLabel + ")";
                            langSel.appendChild(opt);
                        }
                        langSel.disabled = false; subsDl.disabled = false;
                        setSubStatus(tracks.length + " дорожек доступно", "muted");
                    } catch (err) {
                        langSel.innerHTML = '<option value="">—</option>';
                        setSubStatus("Ошибка загрузки списка: " + (err.message || err), "error");
                        subsLoaded = false;
                    }
                };

                subsDl.addEventListener("click", async () => {
                    const val = langSel.value;
                    if (!val) return;
                    const idx = val.indexOf(":");
                    const kind = val.slice(0, idx);
                    const lang = val.slice(idx + 1);
                    const format = fmtSel.value;
                    subsDl.disabled = true;
                    setSubStatus("Скачивание субтитров (" + lang + ", " + format + ")…");
                    try {
                        const params = new URLSearchParams({ video, lang, format, kind });
                        const res = await fetch("/download-subs?" + params.toString(), { headers: { "X-Requested-With": "fetch" } });
                        const data = await res.json();
                        if (data.status === "ok") { setSubStatus("Сохранено: " + (data.output || ""), "success"); loadFiles(); }
                        else setSubStatus(data.message || "Не удалось скачать", "error");
                    } catch (err) {
                        setSubStatus("Ошибка: " + (err.message || err), "error");
                    }
                    subsDl.disabled = false;
                });
            }

            // Filter radios: ALL/V/A/V&A filter format cards; SUB swaps to the subtitles panel.
            const formatGrid = document.querySelector(".format-grid");
            const emptyMsg = document.getElementById("format-empty");
            const emptyLabels = {
                all: "форматов",
                video: "форматов «только видео»",
                audio: "форматов «только звук»",
                muxed: "форматов со звуком и видео в одном файле",
            };
            const applyFilter = (value) => {
                const isSub = value === "sub";
                if (subsPanel) subsPanel.style.display = isSub ? "" : "none";
                if (formatGrid) formatGrid.style.display = isSub ? "none" : "";
                if (emptyMsg && isSub) emptyMsg.hidden = true;
                if (isSub) { loadSubs(); return; }
                let visible = 0;
                document.querySelectorAll(".format-card[data-stream-type]").forEach((card) => {
                    const type = card.dataset.streamType;
                    const show = value === "all" || type === value;
                    card.dataset.hidden = show ? "false" : "true";
                    if (show) visible++;
                });
                if (emptyMsg) {
                    if (visible === 0) {
                        emptyMsg.textContent = "В этом видео нет " + (emptyLabels[value] || "таких форматов") + ".";
                        emptyMsg.hidden = false;
                    } else {
                        emptyMsg.hidden = true;
                    }
                }
            };
            document.querySelectorAll('input[name="format-filter"]').forEach((radio) => {
                radio.addEventListener("change", () => applyFilter(radio.value));
            });
            const checkedFilter = document.querySelector('input[name="format-filter"]:checked');
            applyFilter(checkedFilter ? checkedFilter.value : "all");
            // Start a download for an endpoint and poll it to completion.
            // Returns { success, message, error, path } — path is the saved file name.
            const runDownload = async (endpoint, statusEl, onPercent) => {
                const res = await fetch(endpoint, { headers: { "X-Requested-With": "fetch" } });
                const text = await res.text();
                let data; try { data = JSON.parse(text); } catch { throw new Error(text || "Unexpected response"); }
                if (!res.ok || data.status !== "started") throw new Error(data.message || "Unable to start download");
                for (;;) {
                    const r = await fetch("/download/status?id=" + encodeURIComponent(data.jobId), { headers: { "X-Requested-With": "fetch" } });
                    const t = await r.text();
                    let d; try { d = JSON.parse(t); } catch { throw new Error(t); }
                    if (!r.ok) throw new Error(d.message || "Progress failed");
                    if (statusEl) {
                        if (d.status === "running") statusEl.textContent = "Downloading… " + (d.percent || 0) + "%";
                        else if (d.status === "completed") statusEl.textContent = d.message || "Saved";
                        else if (d.status === "failed") statusEl.textContent = d.error || "Failed";
                    }
                    if (d.status === "running" && onPercent) onPercent(d.percent || 0);
                    if (d.status === "completed") return { success: true, message: d.message, path: d.path };
                    if (d.status === "failed") return { success: false, error: d.error || "Failed" };
                    await delay(600);
                }
            };

            // Start a merge job and poll it to completion. Returns { success, message, error, path }.
            // opts: { name } → output named after the video title; { cleanup } → delete inputs.
            const runMerge = async (files, onPercent, opts) => {
                const params = new URLSearchParams();
                files.forEach((name) => params.append("files", name));
                if (opts && opts.name) params.append("name", opts.name);
                if (opts && opts.cleanup) params.append("cleanup", "1");
                const res = await fetch("/merge?" + params.toString(), { headers: { "X-Requested-With": "fetch" } });
                const text = await res.text();
                let data; try { data = JSON.parse(text); } catch { throw new Error(text || "Unexpected response"); }
                if (data.status === "error") return { success: false, error: data.message || "Merge failed" };
                if (data.status === "ok") return { success: true, message: data.message, path: data.output };
                if (data.status !== "started") throw new Error(data.message || "Unable to start merge");
                for (;;) {
                    const r = await fetch("/download/status?id=" + encodeURIComponent(data.jobId), { headers: { "X-Requested-With": "fetch" } });
                    const t = await r.text();
                    let d; try { d = JSON.parse(t); } catch { throw new Error(t); }
                    if (!r.ok) throw new Error(d.message || "Progress failed");
                    if (d.status === "running" && onPercent) onPercent(d.percent || 0);
                    if (d.status === "completed") return { success: true, message: d.message, path: d.path };
                    if (d.status === "failed") return { success: false, error: d.error || "Merge failed" };
                    await delay(600);
                }
            };

            document.querySelectorAll(".format-card[data-endpoint]").forEach((card) => {
                card.addEventListener("click", async (e) => {
                    e.preventDefault();
                    if (card.classList.contains("loading")) return;
                    const endpoint = card.dataset.endpoint;
                    if (!endpoint) return;
                    const statusEl = card.querySelector(".format-status");
                    card.classList.remove("success", "error"); card.classList.add("loading");
                    if (statusEl) statusEl.textContent = "Starting download…";
                    try {
                        const trackResult = await runDownload(endpoint, statusEl);
                        card.classList.remove("loading");
                        if (trackResult.success) {
                            card.classList.add("success");
                            if (statusEl) statusEl.textContent = trackResult.message || "Saved";
                            // Refresh the explorer so the just-downloaded file shows up (and gets highlighted).
                            await loadFiles();
                        } else {
                            card.classList.add("error");
                            if (statusEl) statusEl.textContent = trackResult.error || "Failed";
                        }
                    } catch (err) {
                        card.classList.remove("loading"); card.classList.add("error");
                        if (statusEl) statusEl.textContent = err.message || "Failed";
                    }
                });
            });

            // One-click: download 251 (audio) → 137 (video) → merge, with the button
            // itself acting as a three-stage progress bar (fill sweeps + text inverts).
            const comboBtn = document.getElementById("combo-best");
            if (comboBtn) {
                const comboFill = comboBtn.querySelector(".combo-fill");
                const comboLabel = comboBtn.querySelector(".combo-label");
                const idleLabel = comboLabel ? comboLabel.textContent : "1080p + audio → MP4";
                let comboResult = null;
                const setFill = (p) => { if (comboFill) comboFill.style.width = Math.max(0, Math.min(100, p)) + "%"; };
                const setLabel = (t) => { if (comboLabel) comboLabel.textContent = t; };

                // Pick dynamically from whatever yt-dlp actually offers: the best
                // video-only stream at ≤1080p, plus the best audio-only stream.
                const num = (v) => parseInt(v, 10) || 0;
                const cards = Array.from(document.querySelectorAll('.format-card[data-endpoint]'));
                const videoCard = cards
                    .filter((c) => c.dataset.streamType === "video" && num(c.dataset.height) > 0 && num(c.dataset.height) <= 1080)
                    .sort((a, b) => num(b.dataset.height) - num(a.dataset.height) || num(b.dataset.bitrate) - num(a.dataset.bitrate))[0];
                const audioCard = cards
                    .filter((c) => c.dataset.streamType === "audio")
                    .sort((a, b) => num(b.dataset.bitrate) - num(a.dataset.bitrate))[0];
                const videoItag = videoCard ? videoCard.dataset.itag : "";
                if (!videoCard || !audioCard) {
                    comboBtn.disabled = true;
                    comboBtn.classList.add("unavailable");
                    comboBtn.title = "Needs a ≤1080p video-only stream and an audio-only stream in this list";
                } else {
                    const markCard = (card, cls) => {
                        card.classList.remove("loading", "success", "error");
                        if (cls) card.classList.add(cls);
                    };
                    comboBtn.addEventListener("click", async () => {
                        if (comboBtn.disabled) return;
                        // Already merged → open the player instead of downloading again.
                        if (comboResult) { openPlayer(comboResult); return; }
                        comboBtn.disabled = true;
                        const vStatus = videoCard.querySelector(".format-status");
                        const aStatus = audioCard.querySelector(".format-status");
                        try {
                            // Stage 1/3 — audio (itag 251)
                            setFill(0); setLabel("1/3 · audio · 0%");
                            markCard(audioCard, "loading");
                            const a = await runDownload(audioCard.dataset.endpoint, aStatus, (p) => {
                                setFill(p); setLabel("1/3 · audio · " + p + "%");
                            });
                            markCard(audioCard, a.success ? "success" : "error");
                            await loadFiles();
                            if (!a.success) throw new Error(a.error || "Audio download failed");

                            // Stage 2/3 — video (itag 137, or 303 as fallback)
                            setFill(0); setLabel("2/3 · video " + videoItag + " · 0%");
                            markCard(videoCard, "loading");
                            const v = await runDownload(videoCard.dataset.endpoint, vStatus, (p) => {
                                setFill(p); setLabel("2/3 · video " + videoItag + " · " + p + "%");
                            });
                            markCard(videoCard, v.success ? "success" : "error");
                            await loadFiles();
                            if (!v.success) throw new Error(v.error || "Video download failed");
                            if (!a.path || !v.path) throw new Error("Could not determine downloaded file names to merge");

                            // Stage 3/3 — merge (name after the YouTube title, delete inputs)
                            setFill(0); setLabel("3/3 · merging · 0%");
                            setStatus("Merging into a phone-ready MP4…");
                            const titleEl = document.getElementById("yt-title");
                            const ytTitle = titleEl ? (titleEl.dataset.title || "") : "";
                            const m = await runMerge([v.path, a.path], (p) => {
                                setFill(p); setLabel("3/3 · merging · " + p + "%");
                            }, { name: ytTitle, cleanup: true });
                            if (!m.success) throw new Error(m.error || "Merge failed");
                            setFill(100);
                            setStatus(m.message || "Merged.", "success");
                            await loadFiles();
                            // Keep the result: the button now opens the player instead of re-downloading.
                            comboResult = m.path;
                            setLabel("▶ Show result");
                            comboBtn.classList.add("has-result");
                        } catch (err) {
                            setFill(0); setLabel("⚠ retry");
                            setStatus("Failed: " + (err.message || err), "error");
                        } finally {
                            comboBtn.disabled = false;
                        }
                    });
                }
            }

            // One-click: best audio → MP3 optimized for Telegram/iPhone/Android.
            const mp3ComboBtn = document.getElementById("combo-mp3");
            if (mp3ComboBtn) {
                const fill = mp3ComboBtn.querySelector(".combo-fill");
                const label = mp3ComboBtn.querySelector(".combo-label");
                let mp3Result = null;
                const setFill = (p) => { if (fill) fill.style.width = Math.max(0, Math.min(100, p)) + "%"; };
                const setLabel = (t) => { if (label) label.textContent = t; };
                const num = (v) => parseInt(v, 10) || 0;
                const cards = Array.from(document.querySelectorAll('.format-card[data-endpoint]'));
                // Preferred audio itags, in order; fall back to the best audio-only stream.
                const PRIORITY = ["251", "140", "250", "249"];
                let audioCard = null;
                for (const it of PRIORITY) {
                    audioCard = cards.find((c) => c.dataset.itag === it);
                    if (audioCard) break;
                }
                if (!audioCard) {
                    audioCard = cards
                        .filter((c) => c.dataset.streamType === "audio")
                        .sort((a, b) => num(b.dataset.bitrate) - num(a.dataset.bitrate))[0];
                }
                if (!audioCard) {
                    mp3ComboBtn.disabled = true;
                    mp3ComboBtn.classList.add("unavailable");
                    mp3ComboBtn.title = "No audio-only stream in this list";
                } else {
                    const aItag = audioCard.dataset.itag;
                    mp3ComboBtn.addEventListener("click", async () => {
                        if (mp3ComboBtn.disabled) return;
                        // Already converted → open the player instead of redoing the work.
                        if (mp3Result) { openPlayer(mp3Result); return; }
                        mp3ComboBtn.disabled = true;
                        const aStatus = audioCard.querySelector(".format-status");
                        audioCard.classList.remove("success", "error"); audioCard.classList.add("loading");
                        try {
                            // Stage 1/2 — download the chosen audio stream.
                            setFill(0); setLabel("1/2 · audio " + aItag + " · 0%");
                            const a = await runDownload(audioCard.dataset.endpoint, aStatus, (p) => {
                                setFill(p); setLabel("1/2 · audio " + aItag + " · " + p + "%");
                            });
                            audioCard.classList.remove("loading");
                            audioCard.classList.add(a.success ? "success" : "error");
                            await loadFiles();
                            if (!a.success) throw new Error(a.error || "Audio download failed");
                            if (!a.path) throw new Error("Could not determine the downloaded file name");

                            if (a.path.toLowerCase().endsWith(".mp3")) {
                                mp3Result = a.path;
                            } else {
                                // Stage 2/2 — convert to a Telegram/phone-ready MP3,
                                // named after the YouTube title (server sanitizes it).
                                setFill(100); setLabel("2/2 · → mp3…");
                                setStatus("Converting audio to MP3 (Telegram/iPhone/Android)…");
                                const titleEl = document.getElementById("yt-title");
                                const ytTitle = titleEl ? (titleEl.dataset.title || "") : "";
                                const params = new URLSearchParams();
                                params.append("files", a.path);
                                if (ytTitle) params.append("name", ytTitle);
                                params.append("cleanup", "1");
                                const res = await fetch("/to-mp3?" + params.toString(), { headers: { "X-Requested-With": "fetch" } });
                                const data = await res.json();
                                if (data.status !== "ok" || !data.outputs || !data.outputs.length) {
                                    throw new Error(data.message || "MP3 conversion failed");
                                }
                                mp3Result = data.outputs[0];
                                setStatus(data.message || "Converted to MP3.", "success");
                            }
                            setFill(100);
                            await loadFiles();
                            setLabel("▶ Show result");
                            mp3ComboBtn.classList.add("has-result");
                        } catch (err) {
                            audioCard.classList.remove("loading");
                            setFill(0); setLabel("⚠ retry");
                            setStatus("Failed: " + (err.message || err), "error");
                        } finally {
                            mp3ComboBtn.disabled = false;
                        }
                    });
                }
            }
        });
    </script>
</body>
</html>
